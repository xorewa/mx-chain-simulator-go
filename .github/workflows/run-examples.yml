name: Run examples

on:
  push:
    branches: [ NewArc ]
  pull_request:
    branches: [ NewArc ]

permissions:
  contents: read


jobs:
  test:
    name: Examples
    runs-on: ubuntu-latest
    env:
      GONOSUMDB: github.com/xorewa/*
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install -r examples/requirements.txt
          pip3 install pytest
      - name: Run examples
        run: |
          make run-examples
